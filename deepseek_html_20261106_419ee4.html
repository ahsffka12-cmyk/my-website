<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام إدارة الاستمارات والمتابعة اليومية</title>

<style>
:root{--bg:#0f172a;--bg2:#0b1220;--card:#1e293b;--card2:#273449;--text:#e2e8f0;--text2:#cbd5e1;--muted:#94a3b8;--accent:#0ea5e9;--accent2:#0284c7;--success:#10b981;--success-bg:rgba(16,185,129,.15);--warning:#f59e0b;--warning-bg:rgba(245,158,11,.15);--danger:#ef4444;--danger-bg:rgba(239,68,68,.15);--border:#334155;--border2:#475569}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);display:flex;direction:rtl;overflow:hidden}
.sidebar{width:250px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0;flex-shrink:0}
.brand{padding:0 20px 20px;border-bottom:1px solid var(--border);margin-bottom:20px}
.brand h1{font-size:1.1rem;color:var(--accent);margin-bottom:4px}
.brand p{font-size:.75rem;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav a{padding:12px 20px;color:var(--text2);text-decoration:none;font-size:.9rem;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .15s;border-right:3px solid transparent}
.nav a:hover{background:var(--card);color:var(--text)}
.nav a.active{background:var(--card);color:var(--accent);border-right-color:var(--accent);font-weight:600}
.nav .icon{width:20px;text-align:center}
.main{flex:1;overflow-y:auto;padding:24px}
.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-head h2{font-size:1.5rem}
.page-head .sub{color:var(--muted);font-size:.85rem;margin-top:4px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--accent)}
.kpi.success::before{background:var(--success)}
.kpi.warning::before{background:var(--warning)}
.kpi.danger::before{background:var(--danger)}
.kpi .label{color:var(--muted);font-size:.8rem;margin-bottom:8px}
.kpi .value{font-size:1.6rem;font-weight:700;direction:ltr;text-align:right}
.kpi .hint{font-size:.72rem;color:var(--muted);margin-top:6px}
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:auto;max-height:calc(100vh - 220px)}
table{width:100%;border-collapse:collapse;font-size:.82rem;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--card2);padding:12px 10px;text-align:right;font-weight:600;border-bottom:2px solid var(--border);z-index:1;font-size:.8rem}
tbody td{padding:10px;border-bottom:1px solid var(--border);color:var(--text2)}
tbody tr:hover{background:rgba(14,165,233,.05)}
.cell-num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:600}
.badge-success{background:var(--success-bg);color:var(--success)}
.badge-warning{background:var(--warning-bg);color:var(--warning)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.badge-info{background:rgba(14,165,233,.15);color:var(--accent)}
.badge-muted{background:var(--card2);color:var(--muted)}
.btn{padding:9px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border2)}
.btn-secondary:hover{background:var(--border)}
.btn-danger{background:var(--danger)}
.btn-success{background:var(--success)}
.btn-sm{padding:5px 10px;font-size:.75rem}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar input[type=text],.toolbar select,.toolbar input[type=month],.toolbar input[type=date]{padding:9px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--card);color:var(--text);font-size:.85rem;font-family:inherit;min-width:140px}
.spacer{flex:1}
.page{display:none}
.page.active{display:block}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:14px;max-width:1100px;width:100%;max-height:90vh;display:flex;flex-direction:column}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:1.1rem}
.modal-close{background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer}
.modal-body{padding:20px 22px;overflow-y:auto}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-field{display:flex;flex-direction:column;gap:6px}
.form-field.full{grid-column:1/-1}
.form-field label{font-size:.8rem;color:var(--muted);font-weight:600}
.form-field input,.form-field select{padding:9px 12px;border-radius:8px;border:1px solid var(--border2);background:var(--bg2);color:var(--text);font-size:.85rem;font-family:inherit}
.form-field input:focus,.form-field select:focus{outline:none;border-color:var(--accent)}
.toast-container{position:fixed;bottom:20px;left:20px;display:flex;flex-direction:column;gap:10px;z-index:200}
.toast{padding:12px 18px;border-radius:10px;background:var(--card);border:1px solid var(--border2);font-size:.85rem;box-shadow:0 8px 20px rgba(0,0,0,.4);max-width:380px}
.toast.success{border-right:4px solid var(--success)}
.toast.warning{border-right:4px solid var(--warning)}
.toast.danger{border-right:4px solid var(--danger)}
.toast.info{border-right:4px solid var(--accent)}
.alert-banner{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:.85rem}
.alert-warning{background:var(--warning-bg);color:var(--warning);border:1px solid rgba(245,158,11,.3)}
.alert-danger{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(239,68,68,.3)}
.alert-info{background:rgba(14,165,233,.1);color:var(--accent);border:1px solid rgba(14,165,233,.3)}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:.9rem}
.active-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.active-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.active-card h4{font-size:1rem;margin-bottom:12px;color:var(--accent)}
.active-card ol{list-style:none;padding:0;counter-reset:rank}
.active-card li{counter-increment:rank;padding:10px 0;border-bottom:1px solid var(--border);font-size:.9rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.active-card li:last-child{border-bottom:none}
.active-card li::before{content:counter(rank);background:var(--accent);color:#fff;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem;flex-shrink:0}
.active-card li .metric{color:var(--muted);font-size:.75rem;margin-right:auto}
.active-card li .plant-tag{background:rgba(14,165,233,.15);color:var(--accent);padding:2px 8px;border-radius:6px;font-size:.72rem;margin-right:6px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab-btn{padding:10px 18px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-size:.85rem;font-family:inherit}
.tab-btn:hover{background:var(--card2);color:var(--text)}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.filter-box{background:var(--card);padding:14px;border-radius:10px;border:1px solid var(--border);margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filter-box label{font-size:.78rem;color:var(--muted);font-weight:600}

.import-preview{background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:12px;margin-top:14px;max-height:320px;overflow:auto}
.import-preview table{font-size:.78rem;width:100%}
.import-preview th,.import-preview td{padding:6px 8px}
.import-summary{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0;padding:12px;background:var(--bg2);border-radius:8px;font-size:.82rem}
.import-summary span{color:var(--muted)}
.import-summary b{color:var(--text)}
.chk{width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}
.upload-zone{border:2px dashed var(--border2);border-radius:12px;padding:40px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg2)}
.upload-zone:hover{border-color:var(--accent);background:rgba(14,165,233,.05)}
.upload-zone .icon{font-size:2.5rem;margin-bottom:12px}
.upload-zone h4{font-size:1rem;margin-bottom:6px}
.upload-zone p{color:var(--muted);font-size:.82rem}
@media (max-width:768px){
  body{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;padding:0;border-left:none;border-bottom:1px solid var(--border);overflow-x:auto}
  .brand{padding:12px;border-left:1px solid var(--border);border-bottom:none;margin:0;min-width:160px}
  .nav{flex-direction:row;overflow-x:auto;padding:8px}
  .nav a{padding:8px 12px;border-right:none;border-bottom:3px solid transparent;white-space:nowrap}
  .nav a.active{border-bottom-color:var(--accent)}
  .main{padding:14px}
  .form-grid{grid-template-columns:1fr}
  .active-cards{grid-template-columns:1fr}

@media print{
  .sidebar,.nav,.toolbar,.btn,.toast-container,.modal-overlay,.filter-box,.tabs,.page-head .toolbar{display:none !important}
  body{background:#fff;color:#000;display:block;overflow:visible;height:auto}
  .main{padding:10px;overflow:visible}
  .page{display:none !important}
  .page.active{display:block !important}
  .kpi,.table-wrap,.active-card{background:#fff !important;border:1px solid #999 !important;max-height:none !important;overflow:visible !important}
  th,td{border:1px solid #999 !important;color:#000 !important;background:#fff !important;padding:5px !important}
  thead th{background:#eee !important}
}
</style>

let DB;
let formsFilter = {search:'', plant:''};
let movFilter = {search:'', plant:''};
let reportFilter = {from:'', to:'', plant:'', item:'', province:'', driver:''};
let reportTab = 'plant';
let importState = null;

function clone(o){ return JSON.parse(JSON.stringify(o)); }

function loadDB(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ DB = JSON.parse(raw); if(!DB || !DB.settings) throw new Error('bad'); }
    else DB = clone(DEFAULTS);
  } catch(e){ DB = clone(DEFAULTS); }
  if(!DB.settings.provinces) DB.settings.provinces = DEFAULTS.settings.provinces.slice();
  DB.forms = DB.forms || [];
  DB.movements = DB.movements || [];
  DB.quotas = DB.quotas || [];
  recalcDeductions();
  saveDB();
}

function saveDB(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch(e){ console.warn(e); }
}

function recalcDeductions(){
  DB.forms.forEach(f => { f.deducted = 0; f.remainder = Number(f.qty)||0; f.deductValue = 0; });
  const sorted = DB.movements.slice().sort((a,b) => String(a.date||'').localeCompare(String(b.date||'')));
  sorted.forEach(m => {
    const isW = DB.settings.weightItems.indexOf(m.item) !== -1;
    const amt = isW ? Number(m.weight) : Number(m.naturalQty);
    m.deductQty = amt || 0;
    m.usedForms = '';
    m.remaining = 0;
    m.alert = '';
    if(!m.plant || !m.item || !(amt > 0)) return;
    let rem = amt;
    const plantForms = DB.forms.filter(f => f.plant === m.plant && f.remainder > 0.0001).sort((a,b) => String(a.date||'').localeCompare(String(b.date||'')));
    const used = [];
    for(let i = 0; i < plantForms.length; i++){
      const f = plantForms[i];
      if(rem <= 0.0001) break;
      const take = Math.min(f.remainder, rem);
      f.remainder = Number((f.remainder - take).toFixed(4));
      f.deducted  = Number((f.deducted  + take).toFixed(4));
      rem         = Number((rem - take).toFixed(4));
      used.push(f.number);
    }
    m.usedForms = used.join(' + ');
    m.remaining = rem;
    if(rem > 0.0001) m.alert = '⚠️ لا يوجد رصيد استمارة كافٍ للمعمل: ' + m.plant;
  });
  DB.forms.forEach(f => {
    f.deductValue = Number(((Number(f.price)||0) * f.deducted).toFixed(2));
    if((Number(f.qty)||0) > 0 && f.remainder <= 0.0001) f.status = 'منتهية';
    else if(f.deducted > 0.0001) f.status = 'قيد الاستهلاك';
    else f.status = 'نشطة';
    f.alert = f.status === 'منتهية' ? '⚠️ انتهت كمية الاستمارة — يجب إدخال استمارة جديدة لنفس المعمل' : '';
  });
}

function fmt(n,d){ if(d===undefined) d=2; if(n===''||n===null||n===undefined||isNaN(n)) return '-'; return Number(n).toLocaleString('en-US',{maximumFractionDigits:d}); }
function today(){ return new Date().toISOString().slice(0,10); }
function monthOf(s){ return String(s||'').slice(0,7); }
function daysInMonth(ym){ const p = String(ym).split('-').map(Number); return new Date(p[0],p[1],0).getDate() || 30; }

function toast(msg, type){
  type = type || 'info';
  const c = document.getElementById('toasts');
  if(!c) return;
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(() => t.remove(), 300); }, 4000);
}

function badge(txt, kind){
  const map = {'نشطة':'success','قيد الاستهلاك':'warning','منتهية':'danger','تم التحويل':'success','تم القطع':'warning','قيد الانتظار':'danger','طبيعي':'success','اقتراب الحد':'warning','تجاوز':'danger'};
  return '<span class="badge badge-' + (kind||map[txt]||'muted') + '">' + (txt||'-') + '</span>';
}

function optHTML(list, val){
  return list.map(v => '<option value="' + v + '"' + (v === val ? ' selected' : '') + '>' + v + '</option>').join('');
}

function downloadBlob(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 200);
}

function exportExcel(sheets, filename){
  if(typeof XLSX !== 'undefined' && XLSX && XLSX.utils){
    try {
      const wb = XLSX.utils.book_new();
      sheets.forEach(s => {
        const ws = XLSX.utils.aoa_to_sheet(s.aoa);
        if(s.aoa[0]) ws['!cols'] = s.aoa[0].map(() => ({wch:18}));
        XLSX.utils.book_append_sheet(wb, ws, String(s.name).replace(/[\\\/\?\*\[\]:]/g,'_').slice(0,31));
      });
      XLSX.writeFile(wb, filename + '.xlsx');
      toast('✅ تم تصدير Excel', 'success');
      return;
    } catch(e){ console.error(e); }
  }
  // fallback
  let html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"><style>td,th{border:1px solid #999;padding:4px;font-family:Arial}</style></head><body>';
  sheets.forEach(s => {
    html += '<h3>' + s.name + '</h3><table dir="rtl">';
    s.aoa.forEach((row, ri) => {
      html += '<tr>' + row.map(c => '<' + (ri===0?'th':'td') + '>' + (c===null||c===undefined?'':String(c)) + '</' + (ri===0?'th':'td') + '>').join('') + '</tr>';
    });
    html += '</table><br>';
  });
  downloadBlob(new Blob(['\uFEFF' + html], {type:'application/vnd.ms-excel;charset=utf-8'}), filename + '.xls');
  toast('✅ تم التصدير (نسخة Excel)', 'success');
}

function renderDashboard(){
  const ym = DB.monitorMonth;
  const monthMovs = DB.movements.filter(m => monthOf(m.date) === ym);
  const totalNatural = monthMovs.reduce((s,m)=>s+(Number(m.naturalQty)||0),0);
  const totalStandard = monthMovs.reduce((s,m)=>s+(Number(m.standardQty)||0),0);
  const totalWeight = monthMovs.reduce((s,m)=>s+(Number(m.weight)||0),0);
  const totalDiff = totalNatural - totalStandard;
  const totalFormsQty = DB.forms.reduce((s,f)=>s+(Number(f.qty)||0),0);
  const totalDeducted = DB.forms.reduce((s,f)=>s+(Number(f.deducted)||0),0);
  const cutRatio = totalFormsQty ? totalDeducted/totalFormsQty : 0;
  const days = daysInMonth(ym);
  const avgDaily = totalNatural / days;
  const pendingForms = DB.forms.filter(f=>f.transferState==='قيد الانتظار').length;
  const trialQuotas = DB.quotas.filter(q=>q.type==='تجريبية (3 أشهر)').length;
  const financialRemainder = DB.forms.reduce((s,f)=>s+f.remainder*(Number(f.price)||0),0);
  const totalDeductValue = DB.forms.reduce((s,f)=>s+(Number(f.deductValue)||0),0);
  const depletedForms = DB.forms.filter(f=>f.status==='منتهية').length;
  const alertMovs = DB.movements.filter(m=>m.alert).length;
  const tripsCount = monthMovs.length;

  document.getElementById('page-dashboard').innerHTML =
    '<div class="page-head"><div><h2>لوحة التحكم</h2><div class="sub">نظرة عامة</div></div>' +
    '<div class="toolbar" style="margin:0"><input type="month" id="dash-month" value="' + ym + '">' +
    '<button class="btn btn-secondary" onclick="exportFullDB()">📊 Excel</button>' +
    '<button class="btn btn-secondary" onclick="printPage()">🖨️ طباعة</button></div></div>' +
    (depletedForms>0?'<div class="alert-banner alert-warning">⚠️ ' + depletedForms + ' استمارة منتهية</div>':'') +
    (alertMovs>0?'<div class="alert-banner alert-danger">🚨 ' + alertMovs + ' حركة بدون رصيد كافٍ</div>':'') +
    '<div class="kpi-grid">' +
      '<div class="kpi"><div class="label">إجمالي الكمية الطبيعية</div><div class="value">' + fmt(totalNatural) + '</div><div class="hint">' + tripsCount + ' رحلة</div></div>' +
      '<div class="kpi success"><div class="label">نسبة القطع</div><div class="value">' + (cutRatio*100).toFixed(2) + '%</div><div class="hint">' + fmt(totalDeducted) + '/' + fmt(totalFormsQty) + '</div></div>' +
      '<div class="kpi"><div class="label">متوسط الاستهلاك اليومي</div><div class="value">' + fmt(avgDaily) + '</div><div class="hint">' + days + ' يوم</div></div>' +
      '<div class="kpi ' + (pendingForms>0?'warning':'') + '"><div class="label">استمارات معلقة</div><div class="value">' + pendingForms + '</div></div>' +
      '<div class="kpi"><div class="label">حصص تجريبية</div><div class="value">' + trialQuotas + '</div></div>' +
      '<div class="kpi"><div class="label">الباقي المالي</div><div class="value">' + fmt(financialRemainder) + '</div></div>' +
      '<div class="kpi success"><div class="label">قيمة الاستقطاع</div><div class="value">' + fmt(totalDeductValue) + '</div></div>' +
    '</div>' +
    '<h3 style="margin:20px 0 12px;font-size:1.1rem">📐 ملخص القياسات</h3>' +
    '<div class="kpi-grid">' +
      '<div class="kpi"><div class="label">الكمية القياسية</div><div class="value">' + fmt(totalStandard) + '</div></div>' +
      '<div class="kpi"><div class="label">الوزن</div><div class="value">' + fmt(totalWeight) + '</div></div>' +
      '<div class="kpi ' + (totalDiff<0?'danger':'success') + '"><div class="label">الفرق</div><div class="value">' + fmt(totalDiff) + '</div></div>' +
      '<div class="kpi"><div class="label">متوسط نسبة الفرق</div><div class="value">' + (totalNatural?((totalDiff/totalNatural)*100).toFixed(2):0) + '%</div></div>' +
      '<div class="kpi"><div class="label">عدد الرحلات</div><div class="value">' + tripsCount + '</div></div>' +
    '</div>';

  const mSel = document.getElementById('dash-month');
  if(mSel) mSel.onchange = e => { DB.monitorMonth = e.target.value; saveDB(); renderDashboard(); };
}

      '<p>يدعم صيغة تقرير اللجنة (RLAPdtls) أو أي ملف بعناوين واضحة</p>' +
      '<input type="file" id="import-file" accept=".xlsx,.xls,.csv" style="display:none">' +
    '</div>' +

        '<div class="modal-head"><h3>📥 استيراد حركات من Excel</h3><button class="modal-close" onclick="closeModal()">×</button></div>' +
        '<div class="modal-body" id="import-content">' + body + '</div>' +
        '<div class="modal-foot">' +
          '<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>' +
          '<button class="btn btn-success" id="import-confirm" style="display:none" onclick="confirmImport()">✅ استيراد</button>' +
        '</div>' +
      '</div>' +

  document.getElementById('import-file').onchange = async function(e){
    const file = e.target.files[0];
    if(!file) return;
    try {
      toast('جاري قراءة الملف...', 'info');
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:true});
      // find sheet
      let sheetName = wb.SheetNames.find(n => /RLAP|حركة|يومي|report/i.test(n)) || wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      const aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false, dateNF:'yyyy-mm-dd'});
      const parsed = parseImportAOA(aoa);

    }
  };
}

function parseImportAOA(aoa){
  // 1) Find header row
  let headerIdx = -1, headerMap = {};
  for(let i = 0; i < Math.min(aoa.length, 40); i++){
    const rowText = aoa[i].map(c => String(c||'')).join(' ');
    if(/اسم\s*السائق|الكمية\s*الطبيعية|driver/i.test(rowText)){
      headerIdx = i;
      aoa[i].forEach((cell, ci) => {
        const h = String(cell||'').trim();
        if(/اسم\s*السائق|driver/i.test(h)) headerMap.driver = ci;
        else if(/رقم\s*السيارة|السيارة|car/i.test(h)) headerMap.car = ci;
        else if(/الجهة\s*المستفيدة|beneficiary/i.test(h)) headerMap.beneficiary = ci;
        else if(/^الوزن$|weight/i.test(h)) headerMap.weight = ci;
        else if(/الكمية\s*القياسية|standard/i.test(h)) headerMap.standardQty = ci;
        else if(/الكمية\s*الطبيعية|natural/i.test(h)) headerMap.naturalQty = ci;
        else if(/رقم\s*المستند|document/i.test(h)) headerMap.docNumber = ci;
        else if(/^ت$|^#$|serial|no/i.test(h)) headerMap.serial = ci;
        else if(/التاريخ|date/i.test(h)) headerMap.date = ci;
        else if(/المعمل|plant/i.test(h)) headerMap.plant = ci;
        else if(/الصنف|item|المنتوج|المنتج/i.test(h)) headerMap.item = ci;
        else if(/المحافظة|province/i.test(h)) headerMap.province = ci;
      });
      break;
    }
  }

  // 2) Fallback for RLAPdtls structure
  if(headerIdx < 0){
    // look for specific labels
    for(let i = 0; i < Math.min(aoa.length, 40); i++){
      const rowText = aoa[i].map(c => String(c||'')).join(' ');
      if(/تفاصيل\s*السيارات/.test(rowText)){ headerIdx = i + 2; break; }
    }
    if(headerIdx < 0) headerIdx = 10;
    headerMap = {driver:5, car:10, beneficiary:14, weight:16, standardQty:19, naturalQty:20, docNumber:22, serial:23};
  }

  // 3) Extract header info (date, plant, item)
  let dateStr = '', detectedPlant = '', detectedItem = '';
  const dateRe = /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/;
  for(let i = 0; i < headerIdx; i++){
    const row = aoa[i] || [];
    row.forEach(cell => {
      if(!cell) return;
      if(cell instanceof Date){
        if(!dateStr) dateStr = cell.toISOString().slice(0,10);
      } else {
        const s = String(cell).trim();
        const dm = s.match(dateRe);
        if(dm && !dateStr) dateStr = dm[1] + '-' + String(dm[2]).padStart(2,'0') + '-' + String(dm[3]).padStart(2,'0');
        if(/مصفى|فرع|معمل/.test(s) && s.length < 40 && !detectedPlant && !/تفاصيل|لجنة/.test(s)){
          detectedPlant = s;
        }
      }
    });
    const rowText = row.map(c => String(c||'')).join(' ');
    if(/نوع\s*المنتوج|نوع\s*المنتج/.test(rowText)){
      // product name is usually the cell just before the label
      for(let ci = row.length-1; ci >= 0; ci--){
        if(/نوع\s*المنتوج/.test(String(row[ci]))){
          for(let k = ci-1; k >= 0; k--){
            const v = String(row[k]||'').trim();
            if(v && /[ا-ي]/.test(v) && !/نوع/.test(v)){ detectedItem = v; break; }
          }
          break;
        }
      }
    }
  }

  // 4) Extract rows
  const rows = [];
  for(let i = headerIdx + 1; i < aoa.length; i++){
    const row = aoa[i] || [];
    if(!row.length) continue;
    const driver = headerMap.driver !== undefined ? String(row[headerMap.driver]||'').trim() : '';
    const natural = headerMap.naturalQty !== undefined ? Number(String(row[headerMap.naturalQty]||'').replace(/,/g,'')) : 0;
    const doc = headerMap.docNumber !== undefined ? String(row[headerMap.docNumber]||'').trim() : '';
    // skip empty or totals rows
    if(!driver && !natural && !doc) continue;
    if(!natural && !doc) continue;
    if(/الإجمالي|المجموع|total/i.test(driver)) continue;
    const r = {
      serial: headerMap.serial !== undefined ? row[headerMap.serial] : '',
      driver: driver,
      car: headerMap.car !== undefined ? String(row[headerMap.car]||'').trim() : '',
      beneficiary: headerMap.beneficiary !== undefined ? String(row[headerMap.beneficiary]||'').trim() : '',
      weight: headerMap.weight !== undefined ? Number(String(row[headerMap.weight]||'').replace(/,/g,'')) || 0 : 0,
      standardQty: headerMap.standardQty !== undefined ? Number(String(row[headerMap.standardQty]||'').replace(/,/g,'')) || 0 : 0,
      naturalQty: natural,
      docNumber: doc,
      date: headerMap.date !== undefined ? String(row[headerMap.date]||'').trim() : '',
      plant: headerMap.plant !== undefined ? String(row[headerMap.plant]||'').trim() : '',
      item: headerMap.item !== undefined ? String(row[headerMap.item]||'').trim() : '',
      province: headerMap.province !== undefined ? String(row[headerMap.province]||'').trim() : '',
      selected: true
    };
    rows.push(r);
  }

  return {headerIdx, headerMap, dateStr, detectedPlant, detectedItem, rows};
}

function renderImportPreview(parsed, filename){
  importState = {parsed: parsed, filename: filename, plant: null, item: null, date: null, province: null};

  // Guess plant/item/date from detection or defaults
  let defaultPlant = DB.settings.plants.find(p => parsed.detectedPlant && parsed.detectedPlant.indexOf(p) !== -1) || '';
  if(!defaultPlant && parsed.detectedPlant && /كربلاء/.test(parsed.detectedPlant)){
    defaultPlant = DB.settings.plants.find(p => /ج/.test(p)) || DB.settings.plants[0];
  }
  if(!defaultPlant) defaultPlant = DB.settings.plants[0];

  let defaultItem = DB.settings.items.find(i => parsed.detectedItem && parsed.detectedItem.indexOf(i) !== -1) || '';
  if(!defaultItem && parsed.detectedItem){
    // try to match partial
    for(const it of DB.settings.items){ if(parsed.detectedItem.indexOf(it) !== -1 || it.indexOf(parsed.detectedItem) !== -1){ defaultItem = it; break; } }
  }
  if(!defaultItem && parsed.detectedItem){
    // add new item
    defaultItem = parsed.detectedItem;
    if(DB.settings.items.indexOf(defaultItem) === -1) DB.settings.items.push(defaultItem);
  }
  if(!defaultItem) defaultItem = DB.settings.items[0];

  let defaultDate = parsed.dateStr || today();

  const plantOpts = DB.settings.plants.map(p => '<option value="' + p + '"' + (p===defaultPlant?' selected':'') + '>' + p + '</option>').join('');
  const itemOpts = DB.settings.items.map(p => '<option value="' + p + '"' + (p===defaultItem?' selected':'') + '>' + p + '</option>').join('');
  const provOpts = ['<option value="">-- بلا --</option>'].concat(DB.settings.provinces.map(p => '<option value="' + p + '">' + p + '</option>')).join('');

  // Build preview rows
  const previewRows = parsed.rows.map((r, idx) =>
    '<tr>' +
      '<td><input type="checkbox" class="chk" data-idx="' + idx + '" ' + (r.selected?'checked':'') + ' onchange="toggleImportRow(' + idx + ',this.checked)"></td>' +
      '<td>' + (r.serial||'') + '</td>' +
      '<td>' + (r.driver||'') + '</td>' +
      '<td>' + (r.car||'') + '</td>' +
      '<td>' + (r.beneficiary||'') + '</td>' +
      '<td class="cell-num">' + fmt(r.naturalQty) + '</td>' +
      '<td class="cell-num">' + fmt(r.standardQty) + '</td>' +
      '<td class="cell-num">' + fmt(r.weight) + '</td>' +
      '<td>' + (r.docNumber||'') + '</td>' +
    '</tr>'
  ).join('');

  const totalNatural = parsed.rows.reduce((s,r) => s + (r.naturalQty||0), 0);
  const totalWeight = parsed.rows.reduce((s,r) => s + (r.weight||0), 0);

  const body =
    '<div class="alert-banner alert-info">📄 تم اكتشاف <b>' + parsed.rows.length + '</b> صف في الملف <b>' + filename + '</b>. ' +
    'يُرجى مراجعة الإعدادات أدناه قبل الاستيراد.</div>' +

    '<div class="form-grid" style="margin-bottom:14px">' +
      '<div class="form-field"><label>المعمل (لكل الحركات)</label><select id="imp-plant">' + plantOpts + '</select></div>' +
      '<div class="form-field"><label>الصنف</label><select id="imp-item">' + itemOpts + '</select></div>' +
      '<div class="form-field"><label>تاريخ الحركة</label><input type="date" id="imp-date" value="' + defaultDate + '"></div>' +
      '<div class="form-field"><label>المحافظة</label><select id="imp-province">' + provOpts + '</select></div>' +
    '</div>' +

function toggleImportRow(idx, checked){
  if(!importState) return;
  importState.parsed.rows[idx].selected = checked;
  const selCount = importState.parsed.rows.filter(r => r.selected).length;
  const el = document.getElementById('imp-sel-count');
  if(el) el.textContent = selCount;
}

function confirmImport(){
  if(!importState) return;
  const {parsed, plant, item, date} = importState;
  const province = importState.province || '';
  if(!plant || !item){ toast('يرجى تحديد المعمل والصنف', 'danger'); return; }

  // Ensure plant exists
  if(DB.settings.plants.indexOf(plant) === -1) DB.settings.plants.push(plant);

  const selectedRows = parsed.rows.filter(r => r.selected);
  if(!selectedRows.length){ toast('لم يتم اختيار أي صف', 'warning'); return; }

  // Check balance
  const isW = DB.settings.weightItems.indexOf(item) !== -1;
  const totalNeeded = selectedRows.reduce((s,r) => s + (isW ? (r.weight||0) : (r.naturalQty||0)), 0);
  const availableBalance = DB.forms.filter(f => f.plant === plant).reduce((s,f) => s + (Number(f.remainder)||0), 0);
  const gap = totalNeeded - availableBalance;

  if(gap > 0.0001){
    const ok = confirm('⚠️ الكمية المطلوبة (' + fmt(totalNeeded) + ') تتجاوز الرصيد المتاح في استمارات "' + plant + '" (' + fmt(availableBalance) + ').\n\n' +
      'المتبقي بدون رصيد: ' + fmt(gap) + '\n\n' +
      'هل تريد المتابعة؟ (سيتم تسجيل الحركات مع تنبيه نقص الرصيد)');
    if(!ok) return;
  }

  // Insert movements
  let added = 0;
  selectedRows.forEach(r => {
    DB.movements.push({
      date: date || r.date || today(),
      plant: plant,
      item: item,
      basin: '',
      car: r.car || '',
      naturalQty: r.naturalQty || 0,
      standardQty: r.standardQty || 0,
      weight: r.weight || 0,
      driver: r.driver || '',
      docNumber: r.docNumber || '',
      loadDate: date || today(),
      province: province,
      beneficiary: r.beneficiary || '',
      notes: 'مستورد من: ' + (importState.filename || '')
    });
    added++;
  });

  recalcDeductions();
  saveDB();
  closeModal();
  importState = null;
  renderAll();

  toast('✅ تم استيراد ' + added + ' حركة بنجاح', 'success');

  const newAlerts = DB.movements.filter(m => m.alert).length;
  if(newAlerts > 0) {
    setTimeout(() => toast('⚠️ ' + newAlerts + ' حركة بدون رصيد كافٍ — راجع صفحة الحركة اليومية', 'warning'), 1500);
  }
}

function buildMonthGroups(ym){
  const groups = {};
  DB.quotas.forEach(q => {
    const k = q.plant + '||' + q.item;
    if(!groups[k]) groups[k] = {plant:q.plant, item:q.item, unit:q.unit, daily:q.daily, monthly:q.monthly, type:q.type, natural:0, standard:0, weight:0, trips:0};
  });
  DB.movements.filter(m => monthOf(m.date) === ym).forEach(m => {
    const k = m.plant + '||' + m.item;
    if(!groups[k]) return;
    groups[k].natural += Number(m.naturalQty)||0;
    groups[k].standard += Number(m.standardQty)||0;
    groups[k].weight += Number(m.weight)||0;
    groups[k].trips++;
  });
  return groups;
}

function renderMonitoring(){
  const ym = DB.monitorMonth;
  const days = daysInMonth(ym);
  const groups = buildMonthGroups(ym);

  const rows = Object.keys(groups).map(k => {
    const g = groups[k];
    const diff = g.natural - g.standard;
    const remaining = g.monthly - g.natural;
    const usage = g.monthly ? g.natural / g.monthly : 0;
    const status = usage > 1 ? 'تجاوز' : usage >= 0.9 ? 'اقتراب الحد' : 'طبيعي';
    return '<tr><td>' + g.plant + '</td><td>' + g.item + '</td><td>' + g.unit + '</td>' +
      '<td class="cell-num">' + fmt(g.daily,0) + '</td><td class="cell-num">' + fmt(g.monthly,0) + '</td>' +
      '<td class="cell-num">' + fmt(g.natural) + '</td><td class="cell-num">' + fmt(g.standard) + '</td>' +
      '<td class="cell-num">' + fmt(g.weight) + '</td>' +
      '<td class="cell-num" style="color:' + (diff<0?'var(--danger)':'inherit') + '">' + fmt(diff) + '</td>' +
      '<td class="cell-num" style="color:' + (remaining<0?'var(--danger)':'inherit') + '">' + fmt(remaining) + '</td>' +
      '<td class="cell-num">' + (usage*100).toFixed(1) + '%</td><td>' + badge(status) + '</td>' +
      '<td class="cell-num">' + g.trips + '</td></tr>';
  }).join('');

  document.getElementById('page-monitoring').innerHTML =
    '<div class="page-head"><div><h2>المتابعة الشهرية</h2></div>' +
    '<div class="toolbar" style="margin:0"><input type="month" id="mon-month" value="' + ym + '">' +
    '<button class="btn btn-secondary" onclick="exportMonitoringExcel()">📊 Excel</button>' +
    '<button class="btn btn-secondary" onclick="printPage()">🖨️ طباعة</button></div></div>' +
    '<div class="table-wrap"><table><thead><tr>' +
    '<th>المعمل</th><th>الصنف</th><th>الوحدة</th><th>اليومي</th><th>الشهري</th>' +
    '<th>طبيعية</th><th>قياسية</th><th>الوزن</th><th>الفرق</th><th>الباقي</th><th>النسبة</th><th>الحالة</th><th>الرحلات</th></tr></thead>' +
    '<tbody>' + (rows || '<tr><td colspan="13" class="empty">لا توجد بيانات</td></tr>') + '</tbody></table></div>';

  const s = document.getElementById('mon-month'); if(s) s.onchange = e => { DB.monitorMonth = e.target.value; saveDB(); renderMonitoring(); };
}

function exportMonitoringExcel(){
  const ym = DB.monitorMonth;
  const groups = buildMonthGroups(ym);
  const aoa = [['المعمل','الصنف','الوحدة','اليومي','الشهري','طبيعية','قياسية','الوزن','الفرق','الباقي','النسبة','الرحلات']];
  Object.keys(groups).forEach(k => {

function getFilteredMovements(){
  return DB.movements.filter(m => {
    if(reportFilter.from && String(m.date||'') < reportFilter.from) return false;
    if(reportFilter.to && String(m.date||'') > reportFilter.to) return false;
    if(reportFilter.plant && m.plant !== reportFilter.plant) return false;
    if(reportFilter.item && m.item !== reportFilter.item) return false;
    if(reportFilter.province && m.province !== reportFilter.province) return false;
    if(reportFilter.driver && m.driver !== reportFilter.driver) return false;
    return true;
  });
}

function aggregateBy(movs, key){
  const agg = {};
  movs.forEach(m => {
    const k = m[key] || '(غير محدد)';
    if(!agg[k]) agg[k] = {name:k, trips:0, natural:0, standard:0, weight:0, forms:{}, plants:{}};
    agg[k].trips++;
    agg[k].natural += Number(m.naturalQty)||0;
    agg[k].standard += Number(m.standardQty)||0;
    agg[k].weight += Number(m.weight)||0;
    if(m.usedForms){ String(m.usedForms).split('+').forEach(f => { agg[k].forms[f.trim()] = true; }); }
    if(m.plant){ agg[k].plants[m.plant] = (agg[k].plants[m.plant]||0) + 1; }
  });
  return Object.keys(agg).map(k => {
    const d = agg[k];
    // Dominant plant
    let maxP = '-', maxC = 0;
    Object.keys(d.plants).forEach(p => { if(d.plants[p] > maxC){ maxC = d.plants[p]; maxP = p; } });
    d.dominantPlant = maxP;
    d.plantsList = Object.keys(d.plants).join(', ');
    return d;
  }).sort((a,b) => b.trips - a.trips);
}

function reportToAoa(){
  const movs = getFilteredMovements();
  const tabCfg = {plant:{col:'المعمل'}, item:{col:'الصنف'}, province:{col:'المحافظة'}, driver:{col:'السائق'}};
  const curKey = reportTab;
  const aggregated = aggregateBy(movs, curKey);

  const headers = [tabCfg[reportTab].col];
  if(reportTab === 'driver') headers.push('المعمل');
  headers.push('عدد الرحلات','طبيعية','قياسية','الوزن','الفرق','الاستمارات');

  const aoa = [headers];
  aggregated.forEach(a => {
    const row = [a.name];
    if(reportTab === 'driver') row.push(a.dominantPlant || '-');
    row.push(a.trips, a.natural, a.standard, a.weight, a.natural - a.standard, Object.keys(a.forms).join(', '));
    aoa.push(row);
  });
  return {aoa, label: tabCfg[reportTab].col};
}

/* ============================================================
   الاختبارات
   ============================================================ */
function renderTests(){
  const totalRemainder = DB.forms.reduce((s,f)=>s+f.remainder,0);
  const negativeQty = DB.movements.filter(m => Number(m.naturalQty) < 0).length;
  const pending = DB.forms.filter(f => f.transferState === 'قيد الانتظار').length;
  const noQuotaMatch = DB.forms.filter(f => !DB.quotas.some(q => q.plant === f.plant && q.item === f.item)).length;
  const noNat = DB.movements.filter(m => !m.naturalQty).length;
  const noBen = DB.movements.filter(m => !m.beneficiary).length;
  const negDiff = DB.movements.filter(m => (Number(m.naturalQty)||0) - (Number(m.standardQty)||0) < 0).length;
  const weightGT = DB.movements.filter(m => Number(m.weight) > Number(m.naturalQty)).length;
  const depleted = DB.forms.filter(f => f.status === 'منتهية').length;
  const alerts = DB.movements.filter(m => m.alert).length;

  const agg = {};
  DB.movements.filter(m => monthOf(m.date) === DB.monitorMonth).forEach(m => {
    const k = m.plant + '||' + m.item;
    agg[k] = (agg[k]||0) + (Number(m.naturalQty)||0);
  });
  let overQuota = 0;
  Object.keys(agg).forEach(k => {
    const parts = k.split('||');
    const q = DB.quotas.find(x => x.plant === parts[0] && x.item === parts[1]);
    if(q && agg[k] > q.monthly) overQuota++;
  });

  const tests = [
    {name:'مجموع الباقي', val: totalRemainder, pass: totalRemainder === 0},
    {name:'خلايا سالبة', val: negativeQty, pass: negativeQty === 0},
    {name:'تجاوزات المخصص', val: overQuota, pass: overQuota === 0},
    {name:'استمارات معلقة', val: pending, pass: pending === 0},
    {name:'استمارات بدون حصة', val: noQuotaMatch, pass: noQuotaMatch === 0},
    {name:'حركات بدون كمية', val: noNat, pass: noNat === 0},
    {name:'حركات بدون جهة', val: noBen, pass: noBen === 0},
    {name:'فرق سالب', val: negDiff, pass: negDiff === 0},
    {name:'وزن > طبيعية', val: weightGT, pass: weightGT === 0},
    {name:'استمارات منتهية', val: depleted, pass: depleted === 0},
    {name:'حركات بدون رصيد', val: alerts, pass: alerts === 0}
  ];

  document.getElementById('page-tests').innerHTML =
    '<div class="page-head"><div><h2>الاختبارات</h2></div></div>' +
    '<div class="table-wrap"><table><thead><tr><th>الاختبار</th><th>القيمة</th><th>النتيجة</th></tr></thead><tbody>' +
    tests.map(t => '<tr><td>' + t.name + '</td><td class="cell-num">' + fmt(t.val) + '</td>' +
      '<td>' + (t.pass?'<span class="badge badge-success">✅ ناجح</span>':'<span class="badge badge-danger">❌ تحقق</span>') + '</td></tr>').join('') +
    '</tbody></table></div>' +
    '<div class="toolbar" style="margin-top:16px">' +
    '<button class="btn btn-secondary" onclick="recalcAndRender()">🔄 إعادة احتساب</button>' +
    '<button class="btn btn-danger" onclick="resetData()">♻️ استعادة تجريبية</button></div>';
}

function resetData(){
  if(!confirm('حذف كل البيانات واستعادة التجريبية؟')) return;
  DB = clone(DEFAULTS);
  recalcDeductions();
  saveDB();
  renderAll();
  toast('تمت الاستعادة', 'info');
}

/* ============================================================
   التصيير والإقلاع
   ============================================================ */
function renderAll(){
  try { renderDashboard(); } catch(e){ console.error('dashboard', e); }
  try { renderQuotas(); } catch(e){ console.error('quotas', e); }
  try { renderForms(); } catch(e){ console.error('forms', e); }
  try { renderMovements(); } catch(e){ console.error('movements', e); }
  try { renderMonitoring(); } catch(e){ console.error('monitoring', e); }
  try { renderReports(); } catch(e){ console.error('reports', e); }
  try { renderTests(); } catch(e){ console.error('tests', e); }
}

window.exportFullDB = exportFullDB;
window.printPage = printPage;
window.openQuotaModal = openQuotaModal;
window.deleteQuota = deleteQuota;
window.exportQuotasExcel = exportQuotasExcel;
window.openFormModal = openFormModal;
window.deleteForm = deleteForm;
window.exportFormsExcel = exportFormsExcel;
window.recalcAndRender = recalcAndRender;
window.openMovementModal = openMovementModal;
window.deleteMovement = deleteMovement;
window.exportMovementsExcel = exportMovementsExcel;
window.openImportModal = openImportModal;
window.toggleImportRow = toggleImportRow;
window.confirmImport = confirmImport;
window.exportMonitoringExcel = exportMonitoringExcel;
window.setReportTab = setReportTab;
window.resetReportFilters = resetReportFilters;
window.exportMostActiveExcel = exportMostActiveExcel;
window.exportCurrentReport = exportCurrentReport;
window.printCurrentReport = printCurrentReport;
window.resetData = resetData;
window.closeModal = closeModal;

window.addEventListener('error', e => console.error('Global:', e.message));

(function init(){
  try {
    loadDB();
    setupNav();
    renderAll();
    console.log('%c✅ النظام جاهز', 'color:#10b981;font-weight:bold;font-size:14px');
  } catch(e){
    console.error(e);
    document.body.innerHTML = '<div style="padding:40px;font-family:Tahoma;color:#ef4444;direction:rtl">' +
      '<h2>⚠️ خطأ</h2><pre style="background:#1e293b;padding:20px;color:#e2e8f0;border-radius:8px">' + e.message + '</pre></div>';
  }
})();
</script>
